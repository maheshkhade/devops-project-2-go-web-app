apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: go-web-app
  name: go-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-web-app
  strategy: {}
  template:
    metadata:
      labels:
        app: go-web-app
    spec:
      containers:
      - image: maheshkhade8600/go-web-app:v1
        name: go-web-app
        resources: {}
        ports:
        - containerPort: 8080
status: {}